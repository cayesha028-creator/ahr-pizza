<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHR Pizza - Best Pizza in Town</title>
<style>
body{font-family:Arial;background:#fff8f0;margin:0}
header{background:#d32f2f;color:white;padding:20px;text-align:center}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px #ccc;overflow:hidden;text-align:center;padding-bottom:10px}
.card img{width:100%;height:160px;object-fit:cover}
h2{margin:10px 0 5px}
.price{color:#d32f2f;font-weight:bold}
button{background:#d32f2f;color:white;border:none;padding:8px 15px;border-radius:20px;margin-top:5px}
</style>
</head>
<body>
<header><h1>AHR PIZZA</h1><p>Fresh & Hot Delivered Fast</p></header>
<div class="menu">
<div class="card"><img src="https://images.unsplash.com/photo-1513104890138-7c749659a591"><h2>Cheese Pizza</h2><div class="price">Rs 799</div><button>Order Now</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1628840042765-356cda07504e"><h2>Zinger Burger</h2><div class="price">Rs 499</div><button>Order Now</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1568909344668-6f14a07b56a0"><h2>Beef Burger</h2><div class="price">Rs 599</div><button>Order Now</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1551782450-a2132b4ba21d"><h2>Chicken Burger</h2><div class="price">Rs 549</div><button>Order Now</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"><h2>Pepperoni Pizza</h2><div class="price">Rs 999</div><button>Order Now</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1593246049226-ded77bf90326"><h2>Fries</h2><div class="price">Rs 299</div><button>Order Now</button></div>
</div>
</body>
</html>
